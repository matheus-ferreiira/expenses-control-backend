[phases.setup]
nixPkgs = [
  "php84",
  "php84Extensions.pdo_mysql",
  "php84Extensions.mysqli",
  "php84Extensions.mbstring",
  "php84Extensions.xml",
  "php84Extensions.curl",
  "php84Extensions.tokenizer",
  "php84Extensions.ctype",
  "php84Extensions.fileinfo",
  "php84Extensions.bcmath",
  "php84Extensions.intl",
  "composer",
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
]

[phases.build]
cmds = [
  "php artisan optimize",
]

[start]
# The scheduler runs in this same container (no separate cron service); boot catch-up recovers missed days.
cmd = "php artisan app:release-migrate && (php artisan finance:extend-recurrences; php artisan finance:realize-card-charges; true) && (php artisan schedule:work &) && php artisan serve --host=0.0.0.0 --port=$PORT"
